<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login and Signup</title>

  <link rel="stylesheet" href="/css/auth.css">

  <script
    src="https://cdnjs.cloudflare.com/ajax/libs/axios/1.20.0/axios.js"
    defer
  ></script>
  <script src="/js/auth.js" defer></script>
</head>
<body>
  <h1>Project Interview Workspace</h1>

  <section id="login-section">
    <h2>Login</h2>

    <form id="login-form" action="/api/auth/login" method="POST">
      <div>
        <label for="login-email">Email</label>
        <input
          id="login-email"
          name="email"
          type="email"
          autocomplete="username"
          required
        >
      </div>

      <div>
        <label for="login-password">Password</label>
        <input
          id="login-password"
          name="password"
          type="password"
          autocomplete="current-password"
          required
        >
      </div>

      <button type="submit">Login</button>
    </form>

    <p id="login-message" role="status"></p>

    <p>
      Don't have an account?
      <button type="button" class="switch-button" id="show-signup">
        Sign up
      </button>
    </p>
  </section>

  <section id="signup-section" hidden>
    <h2>Signup</h2>

    <form id="signup-form" action="/api/auth/register" method="POST">
      <div>
        <label for="signup-name">Name</label>
        <input
          id="signup-name"
          name="name"
          type="text"
          autocomplete="name"
          maxlength="255"
          required
        >
      </div>

      <div>
        <label for="signup-email">Email</label>
        <input
          id="signup-email"
          name="email"
          type="email"
          autocomplete="username"
          required
        >
      </div>

      <div>
        <label for="signup-password">Password</label>
        <input
          id="signup-password"
          name="password"
          type="password"
          autocomplete="new-password"
          minlength="8"
          required
        >
      </div>

      <button type="submit">Signup</button>
    </form>

    <p id="signup-message" role="status"></p>

    <p>
      Already have an account?
      <button type="button" class="switch-button" id="show-login">
        Login
      </button>
    </p>
  </section>
</body>
</html>
